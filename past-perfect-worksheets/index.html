
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Worksheets | M.5</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:24px 12px;
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 background:linear-gradient(145deg,#f5edff,#fff6fc);
 color:#322047
}
main{
 max-width:600px;margin:20px auto;background:white;
 padding:26px;border-radius:22px;
 box-shadow:0 12px 38px #663b921a
}
h1{color:#63339b;margin:0 0 5px;font-size:27px}
.sub{color:#806c96;margin:0 0 23px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{
 width:100%;border:1px solid #d8c9e9;
 border-radius:11px;padding:14px;font-size:17px;
 background:white;color:#322047
}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
 width:100%;border:0;border-radius:12px;
 padding:15px;margin-top:12px;font-size:16px;
 font-weight:750;cursor:pointer;
 background:#63339b;color:white
}
button.secondary{background:#ede3fc;color:#56328a}
button.pink{background:#f7e4f3;color:#9a347b}
small{display:block;color:#736783;line-height:1.6;margin:15px 0}
#preview{
 display:none;width:100%;height:auto;
 margin-top:18px;border:1px solid #e2d5ef;
 border-radius:8px
}
#status{color:#8c2968;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>English Worksheets</h1>
<p class="sub">Basic English · M.5 · Personalized PNG</p>

<label for="worksheet">Choose Worksheet</label>
<select id="worksheet">
<option value="1">Worksheet 1 - Once Upon a Time</option>
<option value="2">Worksheet 2 - The Ant and the Grasshopper</option>

<option value="3">Worksheet 3 - Past Perfect and Past Simple</option>
<option value="4">Worksheet 4 - Past Progressive and Past Perfect</option>
</select>

<label for="name">Full Name</label>
<input id="name" autocomplete="name"
 placeholder="e.g. PATTAREEYA LABPOO">

<div class="cols">
<div>
<label for="classNo">Class M.5/</label>
<input id="classNo" inputmode="numeric" placeholder="e.g. 2">
</div>
<div>
<label for="number">No.</label>
<input id="number" inputmode="numeric" placeholder="e.g. 1">
</div>
</div>

<button class="secondary" id="previewBtn">Preview Worksheet</button>
<button id="downloadBtn">Download PNG</button>
<button class="pink" id="openBtn">Open PNG (mobile/tablet backup)</button>

<small>
If downloading is blocked inside Messenger, choose
<b>Open PNG</b> and save the image using Safari or Chrome.
Your details are processed on your device.
</small>

<p id="status" role="status"></p>
<canvas id="preview"></canvas>
</main>

<script>
const $=id=>document.getElementById(id);
const canvas=$('preview');

const worksheets={
  "1":{
    image:"worksheet.png",
    title:"Past_Perfect_Worksheet_1",
    referenceWidth:1054,
    name:[148,333,470,24],
    cls:[723,333,111,22],
    no:[919,333,76,22],
    classPrefix:"M.5/",
    spots:[
      [265,575],[772,610],[280,800],
      [765,880],[300,1090],[760,1160],[350,1310]
    ]
  },
  "2":{
    image:"worksheet2.png",
    title:"Ant_and_Grasshopper_Worksheet_2",
    referenceWidth:1024,
    name:[170,240,290,20],
    cls:[590,240,140,20],
    no:[829,240,105,20],
    classPrefix:"M.5/",
    spots:[
      [260,410],[760,410],
      [290,600],[730,740],
      [290,900],[730,1120],
      [450,1300]
    ]
  }, 
  },
  "3":{
    image:"worksheet3.png",
    title:"Worksheet_3_Past_Perfect_and_Past_Simple",
    referenceWidth:1024,
    name:[252,1440,285,22],
    cls:[611,1440,92,20],
    no:[783,1440,58,20],
    classPrefix:"M.5/",
    spots:[
      [280,360],[530,560],
      [280,790],[510,1060],[490,1260]
    ]
  },
  "4":{
    image:"worksheet4.png",
    title:"Worksheet_4_Past_Progressive_and_Past_Perfect",
    referenceWidth:1536,
    name:[340,972,485,25],
    cls:[955,972,140,24],
    no:[1210,972,110,24],
    classPrefix:"M.5/",
    spots:[
      [360,350],[1040,350],
      [420,560],[1080,620],[650,800]
    ]
  }

};

function fields(){
 const name=$('name').value.trim().replace(/\s+/g,' ');
 const cls=$('classNo').value.trim()
  .replace(/^m\.?\s*5\s*\/?\s*/i,'');
 const no=$('number').value.trim();

 if(!name||!cls||!no){
  $('status').textContent=
   'Please enter Full Name, Class and No.';
  return null;
 }
 if(!/^\d{1,2}$/.test(cls)||Number(cls)<1){
  $('status').textContent='Enter a valid class number, e.g. 2.';
  return null;
 }
 if(!/^\d{1,2}$/.test(no)||Number(no)<1){
  $('status').textContent='Enter a valid student number.';
  return null;
 }
 $('status').textContent='';
 return {name,cls,no};
}

function fit(c,txt,x,y,max,fontSize,align='left'){
 let size=fontSize;
 do{
  c.font=`700 ${size}px Arial, sans-serif`;
  if(c.measureText(txt).width<=max)break;
  size--;
 }while(size>12);
 c.textAlign=align;
 c.fillText(txt,x,y,max);
}

function loadImage(src){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error('Image not found: '+src));
  img.src=src;
 });
}

async function render(){
 const f=fields();
 if(!f)return false;

 const config=worksheets[$('worksheet').value];
 $('status').textContent='Loading worksheet...';

 const img=await loadImage(config.image);
 canvas.width=img.naturalWidth;
 canvas.height=img.naturalHeight;

 const c=canvas.getContext('2d');
 c.drawImage(img,0,0);

 const s=canvas.width/config.referenceWidth;
 const [nx,ny,nw,nf]=config.name;
 const [cx,cy,cw,cf]=config.cls;
 const [ox,oy,ow,of]=config.no;

 c.fillStyle='#3d176a';
 c.textBaseline='alphabetic';

 fit(c,f.name,nx*s,ny*s,nw*s,nf*s);
 fit(c,config.classPrefix+f.cls,cx*s,cy*s,cw*s,cf*s);
 fit(c,f.no,ox*s,oy*s,ow*s,of*s);

 const stamp=
  `${f.name.toUpperCase()}  •  M.5/${f.cls}  •  NO.${f.no}`;

 c.save();
 c.fillStyle='rgba(112,51,166,.14)';
 c.textAlign='center';
 c.textBaseline='middle';

 for(const [x,y] of config.spots){
  c.save();
  c.translate(x*s,y*s);
  c.rotate(-Math.PI/10);
  fit(c,stamp,0,0,370*s,20*s,'center');
  c.restore();
 }
 c.restore();

 canvas.style.display='block';
 $('status').textContent='Worksheet ready.';
 return true;
}

$('worksheet').onchange=()=>{
 canvas.style.display='none';
 $('status').textContent='';
};

$('previewBtn').onclick=async()=>{
 try{
  if(await render()){
   canvas.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
 }catch(e){
  $('status').textContent='Could not load worksheet image: '+e.message;
 }
};

$('downloadBtn').onclick=async()=>{
 try{
  if(!await render())return;
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  if(!blob)throw Error('PNG failed');

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=
   worksheets[$('worksheet').value].title+
   '_No'+$('number').value.trim()+'.png';

  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){
  $('status').textContent='Download failed. Try Open PNG.';
 }
};

$('openBtn').onclick=async()=>{
 // Open the window directly from the tap, before awaiting.
 const win=window.open('','_blank');
 try{
  if(!await render()){
   if(win)win.close();
   return;
  }
  const url=canvas.toDataURL('image/png');
  if(win){
   win.document.write(
    '<title>Save Worksheet PNG</title>'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<style>body{margin:0;background:#eee}img{display:block;width:100%;height:auto}</style>'+
    '<img alt="Personalized worksheet" src="'+url+'">'
   );
   win.document.close();
  }else{
   const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
   window.location.href=URL.createObjectURL(blob);
  }
 }catch(e){
  if(win)win.close();
  $('status').textContent=
   'Could not open PNG. Try Safari or Chrome.';
 }
};
</script>
</body>
</html>
