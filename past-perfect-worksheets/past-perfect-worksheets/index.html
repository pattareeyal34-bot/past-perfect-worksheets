<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Past Perfect | Worksheet 1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f5edff,#fff6fc);color:#322047;padding:24px 12px}
main{max-width:600px;margin:20px auto;background:white;padding:26px;border-radius:22px;box-shadow:0 12px 38px #663b921a}
h1{color:#63339b;margin:0 0 5px;font-size:27px}.sub{color:#806c96;margin:0 0 23px}label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;border:1px solid #d8c9e9;border-radius:11px;padding:14px;font-size:17px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cols label{margin-top:14px}
button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:12px;font-size:16px;font-weight:750;cursor:pointer;background:#63339b;color:white}
button.secondary{background:#ede3fc;color:#56328a}button.pink{background:#f7e4f3;color:#9a347b}
small{display:block;color:#736783;line-height:1.6;margin:15px 0}#preview{display:none;width:100%;height:auto;margin-top:18px;border:1px solid #e2d5ef;border-radius:8px}#status{color:#8c2968;margin-top:8px}a{color:#63339b}
</style></head>
<body><main><h1>Once Upon a Time</h1><p class="sub">Past Perfect · Worksheet 1 · Personalized PNG</p>
<label for="name">Full Name</label><input id="name" autocomplete="name" placeholder="e.g. PATTAREEYA LABPOO">
<div class="cols"><div><label for="classNo">Class M.5/</label><input id="classNo" inputmode="numeric" placeholder="e.g. 2"></div>
<div><label for="number">No.</label><input id="number" inputmode="numeric" placeholder="e.g. 1"></div></div>
<button class="secondary" id="previewBtn">Preview Worksheet</button>
<button id="downloadBtn">Download PNG</button>
<button class="pink" id="openBtn">Open PNG (mobile/tablet backup)</button>
<small>On a phone or tablet, if downloading is blocked inside Messenger, choose <b>Open PNG</b>, then save the image from Safari or Chrome. The worksheet is generated on your device; your details are not sent to a server.</small>
<p id="status" role="status"></p><canvas id="preview"></canvas>
</main>
<script>
const img=new Image();img.src='worksheet.png';
const $=id=>document.getElementById(id);
const canvas=$('preview');
function fields(){
 const name=$('name').value.trim().replace(/\s+/g,' ');
 const cls=$('classNo').value.trim().replace(/^m\.?\s*5\s*\/?\s*/i,'');
 const no=$('number').value.trim();
 if(!name||!cls||!no){$('status').textContent='Please enter Full Name, Class and No.';return null}
 $('status').textContent='';
 return {name,cls,no};
}
function fit(ctx,txt,x,y,max,fontSize,align='left'){
 let size=fontSize;do{ctx.font=`700 ${size}px Arial, sans-serif`;if(ctx.measureText(txt).width<=max)break;size--}while(size>12);
 ctx.textAlign=align;ctx.fillText(txt,x,y);
}
async function render(){
 const f=fields();if(!f)return false;
 if(!img.complete||!img.naturalWidth){await new Promise((res,rej)=>{img.onload=res;img.onerror=rej})}
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d');c.drawImage(img,0,0);
 const w=canvas.width,h=canvas.height,s=w/1054;
 c.fillStyle='#3d176a';c.textBaseline='alphabetic';
 fit(c,f.name,148*s,333*s,470*s,24*s);
 fit(c,`M.5/${f.cls}`,750*s,333*s,85*s,20*s);
 fit(c,f.no,938*s,333*s,54*s,20*s);
 const stamp=`${f.name.toUpperCase()}  •  M.5/${f.cls}  •  NO.${f.no}`;
 const spots=[[265,575],[772,610],[280,800],[765,880],[300,1090],[760,1160],[350,1310]];
 c.save();c.fillStyle='rgba(112,51,166,.19)';c.textAlign='center';c.textBaseline='middle';
 for(const [x,y] of spots){c.save();c.translate(x*s,y*s);c.rotate(-Math.PI/10);fit(c,stamp,0,0,370*s,20*s,'center');c.restore()}
 c.restore();canvas.style.display='block';return true;
}
$('previewBtn').onclick=async()=>{try{if(await render())canvas.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){$('status').textContent='Could not load worksheet image.'}};
$('downloadBtn').onclick=async()=>{try{if(!await render())return;const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('PNG failed');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Past_Perfect_Worksheet_1_${$('number').value.trim()}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){$('status').textContent='Download failed. Please try Open PNG.'}};
$('openBtn').onclick=async()=>{try{if(!await render())return;const url=canvas.toDataURL('image/png');const win=window.open('','_blank');if(win){win.document.write('<title>Save Worksheet PNG</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#eee}img{display:block;width:100%;height:auto}</style><img alt="Personalized worksheet" src="'+url+'">');win.document.close()}else{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));window.location.href=URL.createObjectURL(blob)}}catch(e){$('status').textContent='Could not open PNG. Please open this website in Safari or Chrome.'}};
</script></body></html>
